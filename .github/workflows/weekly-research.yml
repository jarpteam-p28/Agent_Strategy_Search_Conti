name: Weekly research run

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC (06:17 New York in winter, 07:17 in summer)
  workflow_dispatch:
    inputs:
      max_papers:
        description: "Max papers to read this run"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check strategy files
        run: python -m conti_agents validate

      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m conti_agents run --max-papers "${{ github.event.inputs.max_papers || '4' }}"

      - name: Save this week's findings to main
        run: |
          git config user.name "conti-research-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in papers/index.json papers/seeds.yaml papers/READING_LIST.md papers/summaries strategies \
                   knowledge/method_notes.md transcripts/index.json reports; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new this week."
          else
            git commit -m "Weekly research run ${{ github.run_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
