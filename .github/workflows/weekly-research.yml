name: Weekly research run

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC (07:17 New York)
  workflow_dispatch:
    inputs:
      max_papers:
        description: "Max papers to read this run"
        required: false
        default: "4"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check strategy files
        run: python -m conti_agents validate

      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m conti_agents run --max-papers "${{ github.event.inputs.max_papers || '4' }}"

      - name: Open pull request with this week's findings
        uses: peter-evans/create-pull-request@v6
        with:
          branch: research/weekly-${{ github.run_id }}
          commit-message: "Weekly research run ${{ github.run_id }}"
          title: "Weekly research: new papers and strategy specs"
          body: |
            Automated weekly run. See the newest file in `reports/` for the summary:
            papers read, the WHY behind each, new strategy specs and the critic's verdicts.
          add-paths: |
            papers/index.json
            papers/seeds.yaml
            papers/summaries/**
            strategies/**
            knowledge/method_notes.md
            transcripts/index.json
            reports/**
