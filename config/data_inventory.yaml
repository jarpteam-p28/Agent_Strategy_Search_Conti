  gaps: Contracts 12-21, 03-22, 03-25, 06-25, 09-25 missing; no continuous 1-min NQ series built yet (raw tick files)
file_formats:
  minute: yyyyMMdd HHmmss;open;high;low;close;volume (semicolon, no header)
  tick: yyyyMMdd HHmmss fffffff;last;bid;ask;volume (semicolon, no header)
not_available:
