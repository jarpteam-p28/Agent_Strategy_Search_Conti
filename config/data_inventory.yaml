# What historical data we have, from NinjaTrader exports on the Lexar Armor 700 drive.
# The strategist marks each strategy data_available from this list. Raw data stays on the drive; never committed.

source: NinjaTrader "Last" exports on /Volumes/Lexar Armor 700 Media
confirmed: true
instruments:
- symbol: ES
  description: E-mini S&P 500 futures, continuous front month
  bar_sizes:
  - 1min
  sessions:
  - ETH
  - RTH
  start: '2013-12-08'
  end: '2026-09-02'
  timezone: UTC
  location: Backtest Github/data/clean_ES_master.parquet (4.08M bars, built 2026-10-07; see its MANIFEST)
- symbol: ES
  description: E-mini S&P 500 futures, raw ticks (last, bid, ask, volume)
  bar_sizes:
  - tick
  start: '2021-06-10'
  end: 2023-06
  location: Joshua Backtest data copy of drive/2023 june-2021 september/ES MM-YY.Last.txt (contracts 09-21 to 06-23)
- symbol: NQ
  description: E-mini Nasdaq-100 futures, continuous 1-minute bars built from the tick files
  bar_sizes:
  - 1min
  - 15min
  - 4h
  start: 2021-07
  end: 2026-09
  location: Joshua Backtest data copy of drive/claude python trading scripts/clean_NQ/continuous_1min.parquet (also
    clean_ES/)
- symbol: ES
  description: Raw 1-min contract files (one per quarter)
  bar_sizes:
  - 1min
  start: '2013-12-08'
  end: '2021-06-10'
  location: Pablo backtest data from ninjatrader/ES files/ES MM-YY.Last.txt
- symbol: NQ
  description: E-mini Nasdaq-100 futures, raw ticks (last, bid, ask, volume), one file per contract
  bar_sizes:
  - tick
  start: '2021-07-15'
  end: 2026-09
