# Pipeline settings. Edit freely; every weekly run reads this file.

models:
  scout: claude-sonnet-5-5        # web search for new papers
  reader: claude-sonnet-5-5       # reads the full 40-60 page PDF
  strategist: claude-opus-5-5     # turns finding + WHY into a strategy spec
  critic: claude-opus-5-5         # independent skeptical review
  transcript_miner: claude-opus-5-5

limits:
  max_papers_per_run: 4           # caps API cost per weekly run
  max_new_candidates: 8           # how many new papers the scout proposes
  scout_max_searches: 12
  reader_max_fetches: 4
  max_pdf_mb: 30
  max_pdf_pages: 95               # longer PDFs are cut to the first 95 pages

sources:
  web_search_domains: [ssrn.com, arxiv.org]
  arxiv_categories: [q-fin.TR, q-fin.ST, q-fin.PM]
  arxiv_recent_count: 25
